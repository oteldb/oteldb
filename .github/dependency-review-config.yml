fail_on_severity: "low"
allow_licenses:
  - "MIT"
  - "MIT-0"
  - "ISC"
  - "MPL-2.0"
  - "BSD-2-Clause"
  - "BSD-3-Clause"
  - "Apache-2.0"
  - "LicenseRef-scancode-google-patent-license-golang"
allow-dependencies-licenses:
  # Have a separate non-GPL license.
  - "pkg:golang/github.com/grafana/loki/pkg/push"
  # The pyroscope/api module is Apache-2.0 (its own LICENSE file), though the parent
  # pyroscope repo is AGPL; we use it for the Pyroscope connect QuerierService types.
  - "pkg:golang/github.com/grafana/pyroscope/api"
  # Simply wrong.
  # See https://github.com/hashicorp/cronexpr/blob/master/LICENSE.
  - "pkg:golang/github.com/hashicorp/cronexpr"
  # Used in CI, is not directly linked or used by oteldb.
  - "pkg:actions/go-task/setup-task"
  # Simply wrong: the module's LICENSE file is MPL-2.0; no JSON-licensed
  # files exist in the module. See https://github.com/hashicorp/consul/blob/main/api/LICENSE.
  - "pkg:golang/github.com/hashicorp/consul/api"
  # The SDK offers Apache-2.0 OR UPL-1.0; Apache-2.0 is already permitted.
  # https://github.com/oracle/oci-go-sdk/blob/v65.124.1/LICENSE.txt.
  - "pkg:golang/github.com/oracle/oci-go-sdk/v65@65.124.1"
  # These detector modules carry Apache-2.0 plus the Go Authors' BSD notice,
  # both already permitted; GitHub reports an unrecognized composite license.
  # https://github.com/open-telemetry/opentelemetry-go-contrib/blob/detectors/azure/azureappservice/v0.19.0/LICENSE.
  - "pkg:golang/go.opentelemetry.io/contrib/detectors/aws/elasticbeanstalk@0.19.0"
  - "pkg:golang/go.opentelemetry.io/contrib/detectors/azure/azureappservice@0.19.0"
  - "pkg:golang/go.opentelemetry.io/contrib/detectors/azure/azurecontainerapps@0.19.0"
  - "pkg:golang/go.opentelemetry.io/contrib/detectors/azure/azurefunctions@0.19.0"
  - "pkg:golang/go.opentelemetry.io/contrib/detectors/hetzner@0.19.0"
  - "pkg:golang/go.opentelemetry.io/contrib/detectors/ibmcloud/vpc@0.19.0"
  - "pkg:golang/go.opentelemetry.io/contrib/detectors/vultr@0.19.0"
